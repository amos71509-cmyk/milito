<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A2025" />
    <title>MILITO TECH HOME</title>
    <meta name="description" content="Nigeria's premier marketplace for brand new and premium UK-used smartphones, instant trade-in valuations, and trusted vehicle importation with direct ordering and nationwide delivery." />
    <meta property="og:title" content="MILITO TECH HOME" />
    <meta property="og:description" content="Nigeria's premier marketplace for brand new and premium UK-used smartphones, instant trade-in valuations, and trusted vehicle importation with direct ordering and nationwide delivery." />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preload" as="image" href="/discovery-cards/iphone.webp" />
    <link rel="preload" as="image" href="/discovery-cards/android.jpg" />
    <link rel="preload" as="image" href="/discovery-cards/ipad.jpg" />
    <link rel="preload" as="image" href="/discovery-cards/wrist.jpg" />
  </head>
  <body style="margin:0;background-color:#1A2025;color:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;">
    <div id="root">
      <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background-color:#1A2025;padding:24px;box-sizing:border-box;text-align:center;">
        <div style="max-width:680px;width:100%;">
          <h1 style="font-size:clamp(2.25rem,5vw,3.75rem);font-weight:800;line-height:1.1;margin:0 0 20px 0;letter-spacing:-0.025em;color:#ffffff;">
            Find.<br />
            <span style="color:#00B14F;">Swap.</span><br />
            Upgrade.
          </h1>
          <p style="color:#D1D5DB;font-size:clamp(0.875rem,2vw,1.125rem);line-height:1.6;font-weight:600;margin:0 auto 28px auto;max-width:560px;">
            Shop genuine Brand New &amp; Grade A UK Used smartphones with transparent pricing, accurate battery specs, and reliable nationwide delivery.
          </p>
          <button
            type="button"
            onclick="try{window.history.replaceState({page:'gadgets'},'','/?view=gadgets');this.style.transform='scale(0.96)';this.textContent='OPENING GADGETS...';}catch(e){}"
            style="display:inline-flex;align-items:center;justify-content:center;padding:16px 36px;border-radius:12px;border:none;background-color:#00B14F;color:#000000;font-weight:800;font-size:0.875rem;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;touch-action:manipulation;"
          >
            Shop Gadgets &rarr;
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
